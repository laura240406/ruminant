name: Code Quality Check

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 mypy pycryptodome
          pip install -e .[full]

      - name: Run Flake8
        run: python3 -m flake8 .

      - name: Run Mypy
        run: python3 -m mypy -p ruminant

      - name: Run self test
        run: ruminant --self-test
